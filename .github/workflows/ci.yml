name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    name: Validate & build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setting up Node from `.nvmrc`
        uses: actions/setup-node@v4
        with:
          node-version-file: "./.nvmrc"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"
          scope: "@dusk-network"

      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.js --days 0.5

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Installing dev dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Sync SvelteKit config
        run: npx svelte-kit sync

      - name: Formatting check
        run: npm run format

      - name: Linting
        run: npm run lint

      - name: Type checks
        run: npm run typecheck

      - name: Run the test suite
        run: npm test

      - name: Building the app
        run: npm run build
