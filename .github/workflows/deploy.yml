name: Deploy

# main goes to testnet, as it's pushed or the workflow is run on it: the
# attestation names main. A release tag goes to mainnet, which stays on
# DigitalOcean until the wallet's v2: only once the DEPLOY_MAINNET
# repository variable is "true", and the cloudflare environment takes
# web-wallet-v* tags. Each is built with its site's settings in
# deployments.json, as scripts/verify-build.js rebuilds it.
on:
  push:
    branches: ["main"]
    tags: ["web-wallet-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_type == 'tag' && 'mainnet' || 'testnet' }}
    if: >-
      (github.ref_type == 'branch' && github.ref_name == 'main') ||
      (github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'web-wallet-v') &&
      vars.DEPLOY_MAINNET == 'true')
    # GitHub-hosted, for a clean machine around the Cloudflare token.
    runs-on: ubuntu-latest
    # The token is this environment's, which only main and web-wallet-v*
    # tags can use.
    environment: cloudflare
    # GitHub signs the build manifest's attestation with this workflow's own
    # identity, for this commit: no key to keep.
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      NETWORK: ${{ github.ref_type == 'tag' && 'mainnet' || 'testnet' }}
      SITE: ${{ github.ref_type == 'tag' && 'https://apps.dusk.network/wallet/' || 'https://apps.testnet.dusk.network/wallet/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setting up Node from `.nvmrc`
        uses: actions/setup-node@v4
        with:
          node-version-file: "./.nvmrc"

      # The Cloudflare CLI's lockfile too, which no pull request's CI checks.
      - name: Validate package release ages
        run: |
          node scripts/verify-package-release-ages.js --days 0.5
          node scripts/verify-package-release-ages.js --days 0.5 --lockfile deploy/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Installing dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix deploy

      - name: Verify registry signatures
        run: |
          npm audit signatures
          cd deploy && npm audit signatures

      - name: Taking the site's settings from `deployments.json`
        run: node scripts/deployment-env.js "$SITE" >> "$GITHUB_ENV"

      # As scripts/verify-build.js rebuilds it, with those settings alone.
      - name: Building the app
        run: npm run build

      # GitHub vouches for the manifest, not the site that serves it: this
      # workflow built it from this commit. scripts/verify-build.js
      # --attested checks a site's against it.
      - name: Attesting the build's manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/build-manifest.json

      # Cloudflare serves deploy/site/: the build at wallet/, beside the
      # headers for it.
      - name: Placing the build at /wallet/
        run: node deploy/stage.js

      - name: Deploying to Cloudflare
        run: deploy/node_modules/.bin/wrangler deploy --env "$NETWORK"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
